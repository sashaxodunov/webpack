<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debounce input → p</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f6f9ff, #eef2ff);
      color: #111827;
    }
    .card {
      width: min(640px, 92vw);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
    }
    p {
      margin: 14px 0 0;
      padding: 12px 14px;
      min-height: 48px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
      white-space: pre-wrap;
    }
    .hint { margin-top: 10px; font-size: 12px; color: #6b7280; }
    code { background: #eef2ff; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <label for="textInput">Введите текст:</label>
    <input id="textInput" type="text" placeholder="Печатаю… (обновление через 300мс после остановки)" />
    <p id="output"></p>
    <div class="hint">Используется <code>debounce</code>: каждый ввод сбрасывает предыдущий таймер.</div>
  </div>

  <script>
    const input = document.getElementById('textInput');
    const output = document.getElementById('output');

    let timerId = null;

    input.addEventListener('input', () => {
      // сброс предыдущего отложенного обновления
      if (timerId !== null) clearTimeout(timerId);

      // запуск нового отложенного обновления
      timerId = setTimeout(() => {
        output.textContent = input.value;
        timerId = null;
      }, 300);
    });
  </script>
</body>
</html>
